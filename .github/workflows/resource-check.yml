name: Check public resources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-resource-status
          path: data/public-resource-status.json
          retention-days: 30

