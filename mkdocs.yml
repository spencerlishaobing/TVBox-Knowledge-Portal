site_name: TVBox 复刻与资源工程
site_description: TVBox、影视仓、饭太硬逆向分析与接口资源维护知识库
site_url: https://spencerlishaobing.github.io/TVBox-Knowledge-Portal/
repo_url: https://github.com/spencerlishaobing/TVBox-Knowledge-Portal
repo_name: spencerlishaobing/TVBox-Knowledge-Portal
edit_uri: edit/main/docs/
copyright: 仅用于技术研究、兼容性分析与合法资源维护

theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      timezone: Asia/Shanghai

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 饭太硬逆向:
      - 总览: reverse/fantaiying.md
      - 环境与工具链: reverse/environment.md
      - 可重复破解流程: reverse/workflow.md
  - 影视仓复刻:
      - 复刻总览: reproduction/index.md
      - 功能矩阵: reproduction/feature-matrix.md
      - 架构映射: reproduction/architecture.md
      - 进度与缺口: reproduction/progress.md
  - 资源中心:
      - 资源治理: resources/index.md
      - 直播源健康度: resources/live-status.md
      - 影视接口状态: resources/video-status.md
  - 接口档案:
      - 接口分类: interfaces/index.md
      - TVBox Spider 协议: interfaces/spider.md
      - 网盘与播放链: interfaces/cloud-playback.md
  - 工具与脚本:
      - 脚本索引: tooling/index.md
      - 资源校验: tooling/validation.md
  - 维护手册:
      - 日常维护: maintenance/index.md
      - 版本更新流程: maintenance/release.md
      - 常见陷阱: maintenance/pitfalls.md
  - 报告:
      - 当前状态: reports/current.md

